name: 'Agentic QA'
description: 'Run an Agentic QA check suite against a URL or a mobile device and fail the build when checks fail.'
author: 'test-io'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  host:
    description: 'Base URL of your Agentic QA installation, e.g. https://qa.example.com'
    required: true
  token:
    description: 'API token. Create it under System Configuration -> API / MCP Config, then store it as a secret.'
    required: true
  project-id:
    description: 'UUID of the project that owns the check suite.'
    required: true
  check-suite-id:
    description: 'UUID of the check suite to run.'
    required: true
  channel:
    description: 'web or mobile. Mobile runs on a device and needs product-id plus a device and an app source.'
    required: false
    default: 'web'

  url:
    description: 'URL to test (web only). Required unless environment-id is set.'
    required: false
    default: ''
  environment-id:
    description: 'Environment whose URL is used as the target. Ignored when url is set.'
    required: false
    default: ''
  session-name:
    description: 'Display name for the session. Defaults to the workflow name and short SHA.'
    required: false
    default: ''
  workflow-type:
    description: 'Which workflow to run: web, accessibility, or localization.'
    required: false
    default: 'web'
  browser-type:
    description: 'Browser engine, e.g. chrome. Defaults to the installation default.'
    required: false
    default: ''
  viewport:
    description: 'Viewport override, e.g. 1280x800.'
    required: false
    default: ''
  proxy-config-id:
    description: 'UUID of a proxy config to route browser traffic through. Web only; list them at /api/v1/proxy_configs.'
    required: false
    default: ''
  use-replays:
    description: 'Replay the latest recording per check instead of running fresh AI execution.'
    required: false
    default: 'false'
  await-completion:
    description: 'Wait for the session to finish. When false the action starts the run and exits.'
    required: false
    default: 'true'
  continue-on-failure:
    description: 'Report failing and blocked checks but always exit 0. Does not cover an incomplete result set — a timeout or results that never settle still fail the build.'
    required: false
    default: 'false'
  fail-on-blocked:
    description: 'Treat blocked checks as failures. Blocked usually means a technical problem, not a bug.'
    required: false
    default: 'true'
  timeout-seconds:
    description: 'How long to wait for the session to finish. Checks run only a few at a time, so budget for the whole suite — a 23-check web suite takes about an hour. Too low and the action gives up mid-run.'
    required: false
    default: '7200'
  poll-interval-seconds:
    description: 'Seconds between status polls.'
    required: false
    default: '15'
  product-id:
    description: 'UUID of the mobile product. Required when channel is mobile.'
    required: false
    default: ''
  device-serial:
    description: 'Run on this exact device, by UDID/serial. Either this or device-platform is required for mobile.'
    required: false
    default: ''
  device-platform:
    description: 'Auto-select a device for this platform, e.g. android or ios. Ignored when device-serial is set.'
    required: false
    default: ''
  device-type:
    description: 'Narrows auto-selection, e.g. phone or tablet.'
    required: false
    default: ''
  os-version:
    description: 'Narrows auto-selection to this OS version.'
    required: false
    default: ''
  manufacturer:
    description: 'Narrows auto-selection to this manufacturer.'
    required: false
    default: ''
  device-backend:
    description: 'Device provider. Defaults to the installation default (mobitru).'
    required: false
    default: ''
  app-binary-id:
    description: 'UUID of an uploaded app binary to install before the run. One app source is required for mobile.'
    required: false
    default: ''
  app-package:
    description: 'Run an app already on the device, by package name (Android) or Bundle ID (iOS). Needs device-serial.'
    required: false
    default: ''
  mobile-browser:
    description: 'Test the device browser instead of an app. Installs nothing.'
    required: false
    default: 'false'
  prerequisites:
    description: 'Free-form setup notes to run before the checks, e.g. login steps (mobile only).'
    required: false
    default: ''

  results-settle-seconds:
    description: 'How long to keep re-reading results after the session finishes, until the set stops changing. Guards against reporting a partial run.'
    required: false
    default: '60'
  junit-path:
    description: 'Write a JUnit XML report to this path. Empty disables it.'
    required: false
    default: ''

outputs:
  session-id:
    description: 'UUID of the created test session.'
    value: ${{ steps.run.outputs.session-id }}
  session-url:
    description: 'Link to the session in the Agentic QA UI.'
    value: ${{ steps.run.outputs.session-url }}
  status:
    description: 'Final session status: completed, failed, cancelled, or timed-out.'
    value: ${{ steps.run.outputs.status }}
  checks-total:
    description: 'Number of check executions.'
    value: ${{ steps.run.outputs.checks-total }}
  checks-passed:
    description: 'Number of checks that passed.'
    value: ${{ steps.run.outputs.checks-passed }}
  checks-failed:
    description: 'Number of checks that failed.'
    value: ${{ steps.run.outputs.checks-failed }}
  checks-blocked:
    description: 'Number of checks that were blocked.'
    value: ${{ steps.run.outputs.checks-blocked }}

runs:
  using: 'composite'
  steps:
    - id: run
      shell: bash
      run: ${{ github.action_path }}/scripts/run.sh
      env:
        AQ_HOST: ${{ inputs.host }}
        AQ_TOKEN: ${{ inputs.token }}
        AQ_PROJECT_ID: ${{ inputs.project-id }}
        AQ_CHECK_SUITE_ID: ${{ inputs.check-suite-id }}
        AQ_URL: ${{ inputs.url }}
        AQ_ENVIRONMENT_ID: ${{ inputs.environment-id }}
        AQ_SESSION_NAME: ${{ inputs.session-name }}
        AQ_WORKFLOW_TYPE: ${{ inputs.workflow-type }}
        AQ_BROWSER_TYPE: ${{ inputs.browser-type }}
        AQ_VIEWPORT: ${{ inputs.viewport }}
        AQ_PROXY_CONFIG_ID: ${{ inputs.proxy-config-id }}
        AQ_USE_REPLAYS: ${{ inputs.use-replays }}
        AQ_AWAIT_COMPLETION: ${{ inputs.await-completion }}
        AQ_CONTINUE_ON_FAILURE: ${{ inputs.continue-on-failure }}
        AQ_FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
        AQ_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        AQ_POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        AQ_JUNIT_PATH: ${{ inputs.junit-path }}
        AQ_RESULTS_SETTLE_SECONDS: ${{ inputs.results-settle-seconds }}
        AQ_CHANNEL: ${{ inputs.channel }}
        AQ_PRODUCT_ID: ${{ inputs.product-id }}
        AQ_DEVICE_SERIAL: ${{ inputs.device-serial }}
        AQ_DEVICE_PLATFORM: ${{ inputs.device-platform }}
        AQ_DEVICE_TYPE: ${{ inputs.device-type }}
        AQ_OS_VERSION: ${{ inputs.os-version }}
        AQ_MANUFACTURER: ${{ inputs.manufacturer }}
        AQ_DEVICE_BACKEND: ${{ inputs.device-backend }}
        AQ_APP_BINARY_ID: ${{ inputs.app-binary-id }}
        AQ_APP_PACKAGE: ${{ inputs.app-package }}
        AQ_MOBILE_BROWSER: ${{ inputs.mobile-browser }}
        AQ_PREREQUISITES: ${{ inputs.prerequisites }}
